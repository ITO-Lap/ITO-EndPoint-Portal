openapi: 3.1.0
info:
  title: App Guardian API
  version: 0.1.0
  description: Tenant-scoped inventory, policy, update orchestration, and append-only audit API.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: https://api.example.invalid/api/v1
    description: Replace with the organization's production API origin.
security:
  - entraOIDC: [openid, profile, email]
tags:
  - name: Dashboard
    description: Tenant-level update health and summary metrics.
  - name: Devices
    description: Managed Mac device inventory and scan requests.
  - name: Applications
    description: Discovered application inventory and disposition.
  - name: Updates
    description: Update recommendations, user actions, and execution state.
  - name: Policies
    description: Administrator-controlled application trust and update policy.
  - name: Audit
    description: Append-only security and administrative event history.
  - name: Agent
    description: Device-agent connectivity and authenticated inventory reports.
paths:
  /health:
    get:
      tags: [Agent]
      summary: Check API health
      operationId: getHealth
      security: []
      responses:
        '200':
          description: API is available
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: ok }
        '400': { description: Invalid health request }
        '503': { description: API is not ready to serve requests }
  /agent/inventory:
    post:
      tags: [Agent]
      summary: Submit device inventory
      operationId: submitAgentInventory
      description: Requires an Entra ID access token issued for the enrolled device with the agent:inventory scope. The service must bind device identity to tenant claims and record an audit event; do not trust tenant IDs from the request body.
      security:
        - entraOIDC: [agent:inventory]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentInventoryReport' }
      responses:
        '202':
          description: Inventory accepted for processing
          content:
            application/json:
              schema:
                type: object
                required: [deviceId, acceptedAt]
                properties:
                  deviceId: { type: string, format: uuid }
                  acceptedAt: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { description: Inventory payload is invalid }
  /dashboard/summary:
    get:
      tags: [Dashboard]
      summary: Get dashboard summary
      operationId: getDashboardSummary
      responses:
        '200':
          description: Tenant dashboard metrics
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [secureScore, appsScanned, updatesReady, criticalRisks]
                    properties:
                      secureScore: { type: integer, minimum: 0, maximum: 100 }
                      appsScanned: { type: integer, minimum: 0 }
                      updatesReady: { type: integer, minimum: 0 }
                      criticalRisks: { type: integer, minimum: 0 }
                      deviceName: { type: string }
                      lastScanAt: { type: string, format: date-time }
                      recentActivity: { type: array, items: { $ref: '#/components/schemas/AuditEvent' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /devices:
    get:
      tags: [Devices]
      summary: List devices
      operationId: listDevices
      parameters:
        - in: query
          name: cursor
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: Paginated device inventory
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DevicePage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /devices/{deviceId}:
    get:
      tags: [Devices]
      summary: Get device details
      operationId: getDevice
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      responses:
        '200':
          description: Device details with current scan and update status
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Device' }
        '404': { $ref: '#/components/responses/NotFound' }
  /devices/{deviceId}/scan:
    post:
      tags: [Devices]
      summary: Queue a device scan
      operationId: requestDeviceScan
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      responses:
        '202': { description: Scan accepted and queued }
        '403': { $ref: '#/components/responses/Forbidden' }
  /apps:
    get:
      tags: [Applications]
      summary: List applications
      operationId: listApplications
      parameters:
        - in: query
          name: deviceId
          schema: { type: string, format: uuid }
        - in: query
          name: disposition
          schema: { $ref: '#/components/schemas/Disposition' }
        - in: query
          name: updatesReady
          schema: { type: boolean }
      responses:
        '200':
          description: Applications visible to the authenticated role
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApplicationPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /apps/{appId}/decision:
    put:
      tags: [Applications, Policies]
      summary: Set application disposition
      operationId: setApplicationDisposition
      description: Admin-only action. Approval requires an approved trusted source and non-empty Team ID allowlist.
      parameters:
        - in: path
          name: appId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [disposition]
              properties:
                disposition: { $ref: '#/components/schemas/Disposition' }
                sourceId: { type: string, format: uuid }
                expectedTeamIds: { type: array, items: { type: string } }
      responses:
        '200': { description: Policy updated and audit event recorded }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { description: Approval requirements are incomplete }
  /updates:
    get:
      tags: [Updates]
      summary: List updates
      operationId: listUpdates
      parameters:
        - in: query
          name: deviceId
          schema: { type: string, format: uuid }
        - in: query
          name: state
          schema: { $ref: '#/components/schemas/UpdateState' }
      responses:
        '200':
          description: Update jobs and eligible recommendations
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/UpdateJob' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /updates/{updateId}/actions:
    post:
      tags: [Updates]
      summary: Submit an update action
      operationId: actOnUpdate
      parameters:
        - in: path
          name: updateId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [install_now, schedule, defer, remind_tomorrow, view_release_notes] }
                scheduledFor: { type: string, format: date-time }
      responses:
        '202': { description: User action accepted; policy and device eligibility are evaluated by the service }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Update is no longer eligible }
  /audit-events:
    get:
      tags: [Audit]
      summary: List audit events
      operationId: listAuditEvents
      description: Auditor, Helpdesk, and Admin access is filtered by tenant and role policy.
      parameters:
        - in: query
          name: cursor
          schema: { type: string }
        - in: query
          name: action
          schema: { type: string }
      responses:
        '200':
          description: Append-only audit records
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/AuditEvent' } }
                  nextCursor: { type: [string, 'null'] }
        '401': { $ref: '#/components/responses/Unauthorized' }
components:
  securitySchemes:
    entraOIDC:
      type: openIdConnect
      openIdConnectUrl: https://login.microsoftonline.com/{tenant}/v2.0/.well-known/openid-configuration
  parameters:
    DeviceId:
      in: path
      name: deviceId
      required: true
      schema: { type: string, format: uuid }
  responses:
    Unauthorized:
      description: Missing or invalid OIDC access token
    Forbidden:
      description: Authenticated user lacks the required tenant role
    NotFound:
      description: Resource not found in the caller's tenant
  schemas:
    AgentInventoryReport:
      type: object
      required: [serialNumber, hostname, currentLoggedInUser, scannedAt, applications, issues]
      properties:
        serialNumber: { type: string, minLength: 1 }
        hostname: { type: string, minLength: 1 }
        currentLoggedInUser: { type: string, minLength: 1 }
        scannedAt: { type: string, format: date-time }
        applications: { type: array, items: { $ref: '#/components/schemas/InstalledApplication' } }
        issues: { type: array, items: { $ref: '#/components/schemas/InventoryIssue' } }
    InstalledApplication:
      type: object
      required: [name, bundleIdentifier, installPath, installSource, codeSignature]
      properties:
        name: { type: string }
        bundleIdentifier: { type: string }
        shortVersion: { type: [string, 'null'] }
        bundleVersion: { type: [string, 'null'] }
        installPath: { type: string }
        installSource: { type: string, enum: [systemApplications, currentUserApplications] }
        codeSignature: { $ref: '#/components/schemas/CodeSignatureInspection' }
        lastModifiedAt: { type: [string, 'null'], format: date-time }
    CodeSignatureInspection:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [valid, invalid, unsigned, unavailable] }
        teamIdentifier: { type: [string, 'null'] }
    InventoryIssue:
      type: object
      required: [path, message]
      properties:
        path: { type: string }
        message: { type: string }
    Disposition:
      type: string
      enum: [approved, pending_review, blocked]
    UpdateState:
      type: string
      enum: [queued, downloading, validating, installing, succeeded, failed, rolled_back, deferred, cancelled]
    Device:
      type: object
      required: [id, serialNumber, hostname, scanStatus]
      properties:
        id: { type: string, format: uuid }
        serialNumber: { type: string }
        hostname: { type: string }
        platformVersion: { type: string }
        lastLoggedInUser: { type: [string, 'null'] }
        lastSeenAt: { type: [string, 'null'], format: date-time }
        lastScanAt: { type: [string, 'null'], format: date-time }
        scanStatus: { type: string, enum: [unknown, queued, running, succeeded, failed] }
    DevicePage:
      type: object
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Device' } }
        nextCursor: { type: [string, 'null'] }
    Application:
      type: object
      required: [id, bundleId, name, installedVersion, disposition, risk]
      properties:
        id: { type: string, format: uuid }
        bundleId: { type: string }
        name: { type: string }
        installedVersion: { type: string }
        latestVersion: { type: [string, 'null'] }
        disposition: { $ref: '#/components/schemas/Disposition' }
        risk: { type: string, enum: [low, medium, high, critical] }
        sourceName: { type: [string, 'null'] }
        updateReady: { type: boolean }
    ApplicationPage:
      type: object
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Application' } }
        nextCursor: { type: [string, 'null'] }
    UpdateJob:
      type: object
      properties:
        id: { type: string, format: uuid }
        deviceId: { type: string, format: uuid }
        applicationId: { type: string, format: uuid }
        fromVersion: { type: string }
        targetVersion: { type: string }
        state: { $ref: '#/components/schemas/UpdateState' }
        scheduledFor: { type: [string, 'null'], format: date-time }
        validationResults: { type: array, items: { type: object } }
    AuditEvent:
      type: object
      required: [id, action, outcome, occurredAt]
      properties:
        id: { type: string }
        action: { type: string }
        outcome: { type: string, enum: [success, failure, denied, info] }
        occurredAt: { type: string, format: date-time }
        details: { type: object, additionalProperties: true }